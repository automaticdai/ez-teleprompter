# Test on every push/PR; build the polished Windows artifacts (single-file
# portable exe + NSIS installer, with the embedded icon) natively on a Windows
# runner — the one thing a Linux/WSL dev box can't do without wine.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      # --publish never: artifact upload below is the delivery channel; don't
      # let electron-builder auto-publish to GitHub releases on tag builds.
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: EZ-Teleprompter-windows
          path: |
            app/dist/*.exe
          if-no-files-found: error

  # Tag a commit `v*` to attach the exes to a GitHub release automatically.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: EZ-Teleprompter-windows
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
          generate_release_notes: true
